<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识学习库 — imoons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa;
  --bg-card: #ffffff;
  --bg-nav: #ffffff;
  --border: #e8e8ec;
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --accent: #6366f1;
  --accent-light: #eef2ff;
  --accent-hover: #4f46e5;
  --tag-bg: #f3f4f6;
  --tag-text: #374151;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-w: 220px;
  --header-h: 56px;
}

[data-theme="dark"] {
  --bg: #0f1117;
  --bg-card: #1a1b2e;
  --bg-nav: #16172a;
  --border: #252640;
  --text-primary: #e8eaf6;
  --text-secondary: #9194a6;
  --text-muted: #5c5f7a;
  --accent: #818cf8;
  --accent-light: #1e2040;
  --accent-hover: #a5b4fc;
  --tag-bg: #252640;
  --tag-text: #c4c7e0;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.2s, color 0.2s;
}

/* ── Header ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-nav);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  z-index: 100;
}

.logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  text-decoration: none;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-icon {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: white;
  font-weight: 700;
}

.search-bar {
  flex: 1;
  max-width: 440px;
  position: relative;
}

.search-bar input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13.5px;
  background: var(--bg);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.search-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
  pointer-events: none;
}

.search-clear {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  display: none;
}

.search-clear.visible { display: block; }

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.icon-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-nav);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s;
}

.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Layout ── */
.layout {
  display: flex;
  padding-top: var(--header-h);
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  position: fixed;
  top: var(--header-h);
  left: 0; bottom: 0;
  width: var(--sidebar-w);
  overflow-y: auto;
  padding: 20px 12px;
}

.sidebar-section { margin-bottom: 20px; }

.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  padding: 0 8px 6px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
  transition: all 0.12s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.sidebar-item:hover {
  background: var(--bg);
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 500;
}

.sidebar-item .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg);
  padding: 1px 6px;
  border-radius: 10px;
}

.sidebar-item.active .count {
  background: var(--accent);
  color: white;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 12px 8px;
}

/* ── Main ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 32px 32px 60px;
  max-width: 900px;
}

.page-header {
  margin-bottom: 28px;
}

.page-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.page-sub {
  font-size: 13.5px;
  color: var(--text-secondary);
}

/* ── Stats Bar ── */
.stats-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  min-width: 100px;
}

.stat-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── Category Pills ── */
.cat-pills {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.cat-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s;
}

.cat-pill:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.cat-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.cat-pill .icon { font-size: 13px; }

/* ── Article Grid ── */
.articles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.article-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.18s;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
}

.article-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.card-cat {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--accent-light);
  color: var(--accent);
}

.card-level {
  font-size: 11px;
  color: var(--text-muted);
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
  flex: 1;
}

.card-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.tag {
  font-size: 11px;
  padding: 2px 8px;
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: 4px;
}

.card-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: auto;
}

.card-footer .dot { color: var(--border); }

/* ── Article Detail ── */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 16px;
  overflow-y: auto;
}

.detail-overlay.visible { display: flex; }

.detail-modal {
  background: var(--bg-card);
  border-radius: 14px;
  width: 100%;
  max-width: 820px;
  position: relative;
  animation: slideUp 0.25s ease;
  box-shadow: var(--shadow-lg);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.detail-header {
  padding: 24px 28px 0;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.detail-close {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.12s;
  flex-shrink: 0;
}

.detail-close:hover { border-color: var(--accent); color: var(--accent); }

.detail-meta {
  flex: 1;
}

.detail-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 8px;
}

.detail-info {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12.5px;
  color: var(--text-muted);
  flex-wrap: wrap;
}

.detail-body {
  padding: 20px 28px 32px;
}

.detail-body h2 {
  font-size: 17px;
  font-weight: 600;
  margin: 24px 0 10px;
  color: var(--text-primary);
}

.detail-body h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 18px 0 8px;
}

.detail-body p {
  font-size: 14.5px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  line-height: 1.7;
}

.detail-body ul, .detail-body ol {
  padding-left: 20px;
  margin-bottom: 12px;
}

.detail-body li {
  font-size: 14.5px;
  color: var(--text-secondary);
  margin-bottom: 5px;
  line-height: 1.6;
}

.detail-body pre.code {
  background: #1e1e2e;
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  overflow-x: auto;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.6;
  color: #cdd6f4;
  margin: 14px 0;
}

.detail-body strong {
  font-weight: 600;
  color: var(--text-primary);
}

.detail-body .divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

/* ── Tags in detail ── */
.detail-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

/* ── Loading ── */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 13px;
}

/* ── Animations ── */
.fade-in {
  animation: fadeIn 0.3s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px 16px; }
  .articles-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <a href="#" class="logo">
    <div class="logo-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
    知识学习库
  </a>
  <div class="search-bar">
    <span class="search-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    <input type="text" id="searchInput" placeholder="搜索标题、标签...">
    <button class="search-clear" id="searchClear" onclick="clearSearch()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="themeToggle" title="切换主题" onclick="toggleTheme()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
    <button class="icon-btn" title="GitHub" onclick="location.href='https://github.com/iiiiber/kb-imoons'">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    </button>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">浏览</div>
      <button class="sidebar-item active" data-cat="all" onclick="filterCat('all')">
        <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> 全部文章
        <span class="count" id="count-all">0</span>
      </button>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">分类</div>
      <div id="sidebarCats"></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div class="page-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 知识学习库</div>
      <div class="page-sub">技术沉淀 · 持续更新 · 精选优质内容</div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num" id="stat-articles">—</div>
        <div class="stat-label">篇文章</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-cats">—</div>
        <div class="stat-label">个分类</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-tags">—</div>
        <div class="stat-label">个标签</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-views">—</div>
        <div class="stat-label">总阅读</div>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="cat-pills" id="catPills">
      <button class="cat-pill active" data-cat="all" onclick="filterCat('all')">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> 全部
      </button>
    </div>

    <!-- Articles Grid -->
    <div class="articles-grid" id="articlesGrid">
      <div class="loading">加载中...</div>
    </div>
  </main>
</div>

<!-- Article Detail Modal -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-modal" id="detailModal" onclick="event.stopPropagation()">
    <div class="detail-header">
      <button class="detail-close" onclick="closeDetail()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="detail-meta">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-info">
          <span id="detailCat"></span>
          <span>•</span>
          <span id="detailLevel"></span>
          <span>•</span>
          <span id="detailDate"></span>
          <span>•</span>
          <span id="detailViews"></span>
        </div>
        <div class="detail-tags" id="detailTags" style="margin-top:10px"></div>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<script>
// ── State ──
let allData = { categories: [], articles: [] };
let activeCat = 'all';

// ── Load Data ──
async function loadData() {
  try {
    const resp = await fetch('data/knowledge.json');
    allData = await resp.json();
    renderAll();
  } catch (e) {
    document.getElementById('articlesGrid').innerHTML =
      '<div class="empty-state"><div class="empty-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.93 4.93A10 10 0 0 1 9 2a10 10 0 0 1 8.54 5.72"/><path d="M7.51 7.51A5 5 0 0 1 11 4.5a5 5 0 0 1 3.06 2.12"/><path d="M2 12a10 10 0 0 1 14.93-8.93"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg></div>数据加载失败，请刷新重试</div>';
  }
}

// ── Render ──
function renderAll() {
  renderSidebar();
  renderPills();
  renderStats();
  renderArticles();
}

function renderSidebar() {
  const container = document.getElementById('sidebarCats');
  container.innerHTML = '';

  const catCount = {};
  allData.articles.forEach(a => {
    catCount[a.category] = (catCount[a.category] || 0) + 1;
  });

  allData.categories
    .sort((a,b) => a.order - b.order)
    .forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-item' + (activeCat === cat.id ? ' active' : '');
      btn.dataset.cat = cat.id;
      btn.onclick = () => filterCat(cat.id);
      btn.innerHTML = `<span>${cat.icon}</span> ${cat.name}<span class="count">${catCount[cat.id] || 0}</span>`;
      container.appendChild(btn);
    });

  // All count in sidebar
  document.getElementById('count-all').textContent = allData.articles.length;
}

function renderPills() {
  const container = document.getElementById('catPills');
  container.innerHTML = `
    <button class="cat-pill${activeCat==='all'?' active':''}" data-cat="all" onclick="filterCat('all')">
      <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> 全部
    </button>
  `;
  allData.categories.sort((a,b) => a.order - b.order).forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (activeCat === cat.id ? ' active' : '');
    btn.dataset.cat = cat.id;
    btn.onclick = () => filterCat(cat.id);
    btn.innerHTML = `<span class="icon">${cat.icon}</span> ${cat.name}`;
    container.appendChild(btn);
  });
}

function renderStats() {
  document.getElementById('stat-articles').textContent = allData.articles.length;
  document.getElementById('stat-cats').textContent = allData.categories.length;

  const allTags = [...new Set(allData.articles.flatMap(a => a.tags || []))];
  document.getElementById('stat-tags').textContent = allTags.length;

  const totalViews = allData.articles.reduce((s, a) => s + (a.views || 0), 0);
  document.getElementById('stat-views').textContent = totalViews >= 1000
    ? (totalViews/1000).toFixed(1) + 'k' : totalViews;
}

function getCatName(catId) {
  const cat = allData.categories.find(c => c.id === catId);
  return cat ? { name: cat.name, icon: cat.icon } : { name: catId, icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' };
}

function renderArticles() {
  const grid = document.getElementById('articlesGrid');
  const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

  let articles = allData.articles;
  if (activeCat !== 'all') articles = articles.filter(a => a.category === activeCat);
  if (searchVal) {
    articles = articles.filter(a =>
      a.title.toLowerCase().includes(searchVal) ||
      (a.tags || []).some(t => t.toLowerCase().includes(searchVal)) ||
      (a.desc || '').toLowerCase().includes(searchVal)
    );
  }

  if (articles.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>没有找到相关文章</div>`;
    return;
  }

  grid.innerHTML = articles.map(a => {
    const cat = getCatName(a.category);
    return `
    <div class="article-card fade-in" onclick="openDetail('${a.id}')">
      <div class="card-top">
        <span class="card-cat">${cat.icon} ${cat.name}</span>
        <span class="card-level">${a.level || ''}</span>
      </div>
      <div class="card-title">${a.title}</div>
      <div class="card-desc">${a.desc || ''}</div>
      <div class="card-tags">
        ${(a.tags||[]).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="card-footer">
        <span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${a.author || 'imoons'}</span>
        <span class="dot">•</span>
        <span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${a.date || ''}</span>
        <span class="dot">•</span>
        <span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ${a.views || 0}</span>
      </div>
    </div>
    `;
  }).join('');
}

// ── Filter ──
function filterCat(cat) {
  activeCat = cat;

  // Update pills
  document.querySelectorAll('.cat-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === cat);
  });

  // Update sidebar
  document.querySelectorAll('.sidebar-item').forEach(s => {
    s.classList.toggle('active', s.dataset.cat === cat);
  });

  renderArticles();
}

// ── Search ──
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  searchClear.classList.toggle('visible', searchInput.value.length > 0);
  renderArticles();
});

function clearSearch() {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  renderArticles();
}

// ── Detail ──
function openDetail(id) {
  const article = allData.articles.find(a => a.id === id);
  if (!article) return;

  const cat = getCatName(article.category);

  document.getElementById('detailTitle').textContent = article.title;
  document.getElementById('detailCat').textContent = `${cat.icon} ${cat.name}`;
  document.getElementById('detailLevel').textContent = article.level || '';
  document.getElementById('detailDate').textContent = article.date || '';
  document.getElementById('detailViews').textContent = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ${article.views || 0} 次阅读`;
  document.getElementById('detailTags').innerHTML = (article.tags||[]).map(t => `<span class="tag">${t}</span>`).join('');

  document.getElementById('detailBody').innerHTML = article.content || '<p>内容加载中...</p>';

  document.getElementById('detailOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeDetail(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('detailOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

// ── Theme ──
(function initTheme() {
  const saved = localStorage.getItem('kb-theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('kb-theme', isDark ? '' : 'dark');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (e.key === '/' && !e.target.matches('input')) {
    e.preventDefault();
    searchInput.focus();
  }
});

// ── Init ──
loadData();
</script>
</body>
</html>
