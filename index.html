<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识学习库 — imoons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6fa;
  --bg-card: #ffffff;
  --bg-sidebar: #ffffff;
  --border: #e4e7f0;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --accent: #6366f1;
  --accent-dark: #4f46e5;
  --accent-light: #eef2ff;
  --accent-mid: #c7d2fe;
  --success: #10b981;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 240px;
  --header-h: 60px;
}

[data-theme="dark"] {
  --bg: #0c0e14;
  --bg-card: #151821;
  --bg-sidebar: #151821;
  --border: #1e2130;
  --text-primary: #e2e8f0;
  --text-secondary: #8892a4;
  --text-muted: #4a5168;
  --accent: #818cf8;
  --accent-dark: #a5b4fc;
  --accent-light: #1e2040;
  --accent-mid: #3730a3;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Header ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 20px;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}

.logo-icon {
  width: 34px; height: 34px;
  background: var(--accent);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-icon svg { width: 18px; height: 18px; }

.logo-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.search-bar {
  flex: 1;
  max-width: 440px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 9px 40px 9px 38px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13.5px;
  background: var(--bg);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.search-input::placeholder { color: var(--text-muted); }

.search-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-clear {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  border: none; background: none;
  cursor: pointer; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: background 0.12s;
}

.search-clear:hover { background: var(--border); color: var(--text-secondary); }
.search-clear.visible { display: flex; }

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.icon-btn {
  width: 36px; height: 36px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s;
  text-decoration: none;
}

.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}

.icon-btn svg { width: 15px; height: 15px; }

/* ── Layout ── */
.layout {
  display: flex;
  padding-top: var(--header-h);
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  position: fixed;
  top: var(--header-h);
  left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 12px;
}

.sidebar-section { margin-bottom: 8px; }

.sidebar-label {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  padding: 0 10px 6px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s;
  border: none; background: none;
  width: 100%; text-align: left;
  text-decoration: none;
  position: relative;
}

.sidebar-item:hover {
  background: var(--bg);
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

.sidebar-item.active .sidebar-icon { color: var(--accent); }

.sidebar-icon {
  width: 16px; height: 16px;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: color 0.12s;
}

.sidebar-item:hover .sidebar-icon { color: var(--text-secondary); }

.sidebar-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--bg);
  padding: 1px 7px;
  border-radius: 10px;
  transition: all 0.12s;
}

.sidebar-item.active .sidebar-count {
  background: var(--accent);
  color: white;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 10px 8px;
}

/* ── Main ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 36px 40px 60px;
  max-width: 960px;
}

.page-header {
  margin-bottom: 32px;
}

.page-eyebrow {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 6px;
}

.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.page-sub {
  font-size: 14px;
  color: var(--text-secondary);
}

/* ── Stats ── */
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  min-width: 110px;
}

.stat-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

.stat-icon svg { width: 16px; height: 16px; }

.stat-num {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1;
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}

/* ── Category Pills ── */
.cat-pills {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.cat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 500;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}

.cat-pill:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.cat-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.cat-pill svg { width: 13px; height: 13px; }

/* ── Articles Grid ── */
.articles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.article-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-sm);
}

.article-card:hover {
  border-color: var(--accent-mid);
  box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.card-cat-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 5px;
  background: var(--accent-light);
  color: var(--accent);
}

.card-cat-badge svg { width: 11px; height: 11px; }

.card-level {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.4;
  margin-bottom: 8px;
  color: var(--text-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 14px;
  line-height: 1.6;
  flex: 1;
}

.card-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.card-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: auto;
}

.card-footer svg { width: 12px; height: 12px; opacity: 0.6; }

.footer-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.footer-sep {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
}

/* ── Detail Modal ── */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px;
  overflow-y: auto;
}

.detail-overlay.visible { display: flex; }

.detail-modal {
  background: var(--bg-card);
  border-radius: 16px;
  width: 100%;
  max-width: 800px;
  position: relative;
  animation: modalSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  margin: auto;
}

@keyframes modalSlide {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.detail-header {
  padding: 24px 28px 0;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.detail-close {
  width: 34px; height: 34px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.12s;
  flex-shrink: 0;
}

.detail-close:hover { border-color: var(--accent); color: var(--accent); }
.detail-close svg { width: 14px; height: 14px; }

.detail-meta { flex: 1; }

.detail-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.3;
  margin-bottom: 10px;
}

.detail-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-muted);
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.detail-info-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.detail-info-item svg { width: 12px; height: 12px; }

.detail-divider {
  height: 1px;
  background: var(--border);
}

.detail-body {
  padding: 24px 28px 36px;
}

.detail-body h2 {
  font-size: 17px;
  font-weight: 700;
  margin: 28px 0 12px;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.detail-body h2:first-child { margin-top: 0; }

.detail-body h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 20px 0 8px;
}

.detail-body p {
  font-size: 14.5px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  line-height: 1.75;
}

.detail-body ul, .detail-body ol {
  padding-left: 20px;
  margin-bottom: 14px;
}

.detail-body li {
  font-size: 14.5px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  line-height: 1.65;
}

.detail-body pre.code {
  background: #1e1e2e;
  border-radius: 10px;
  padding: 18px 22px;
  overflow-x: auto;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 13px;
  line-height: 1.65;
  color: #cdd6f4;
  margin: 16px 0;
  border: 1px solid #313244;
}

.detail-body strong { font-weight: 700; color: var(--text-primary); }

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.empty-icon {
  width: 52px; height: 52px;
  margin: 0 auto 16px;
  color: var(--text-muted);
  opacity: 0.5;
}

.empty-state p { font-size: 14px; }

/* ── Loading ── */
.loading {
  text-align: center;
  padding: 80px 20px;
  font-size: 13px;
  color: var(--text-muted);
}

/* ── Animations ── */
.fade-in {
  animation: fadeIn 0.3s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px 16px 40px; }
  .articles-grid { grid-template-columns: 1fr; }
  .stats-row { gap: 8px; }
  .stat-card { min-width: 90px; padding: 12px 14px; }
}
</style>
</head>

</header>

<div class="layout">
  <!-- Sidebar -->

        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </div>
        <div>
          <div class="stat-num" id="stat-cats">—</div>
          <div class="stat-label">个分类</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
        </div>
        <div>
          <div class="stat-num" id="stat-tags">—</div>
          <div class="stat-label">个标签</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div>
          <div class="stat-num" id="stat-views">—</div>
          <div class="stat-label">总阅读</div>
        </div>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="cat-pills" id="catPills"></div>

    <!-- Grid -->
    <div class="articles-grid" id="articlesGrid">
      <div class="loading">加载中...</div>
    </div>
  </main>
</div>

<!-- Detail Modal -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-modal" id="detailModal" onclick="event.stopPropagation()">
    <div class="detail-header">
      <button class="detail-close" onclick="closeDetail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="detail-meta">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-info" id="detailInfo"></div>
        <div class="detail-divider"></div>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<script>
// ── State ──
let allData = { categories: [], articles: [] };
let activeCat = 'all';

// ── Load ──
async function loadData() {
  try {
    const resp = await fetch('data/knowledge.json');
    allData = await resp.json();
    renderAll();
  } catch (e) {
    document.getElementById('articlesGrid').innerHTML =
      '<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p>数据加载失败，请刷新重试</p></div>';
  }
}

// ── Render All ──
function renderAll() {
  renderSidebar();
  renderPills();
  renderStats();
  renderArticles();
}

function renderSidebar() {
  const container = document.getElementById('sidebarCats');
  container.innerHTML = '';

  const catCount = {};
  allData.articles.forEach(a => { catCount[a.category] = (catCount[a.category] || 0) + 1; });

  const iconMap = { frontend: gridIcon, backend: serverIcon, devops: cloudIcon, ai: aiIcon, tools: toolIcon };
  const icons = { frontend: gridIcon, backend: serverIcon, devops: cloudIcon, ai: aiIcon, tools: toolIcon };

  allData.categories.sort((a,b) => a.order - b.order).forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'sidebar-item' + (activeCat === cat.id ? ' active' : '');
    btn.dataset.cat = cat.id;
    btn.onclick = () => filterCat(cat.id);
    btn.innerHTML = `${icons[cat.id] || folderIcon} ${cat.name}<span class="sidebar-count">${catCount[cat.id]||0}</span>`;
    container.appendChild(btn);
  });

  document.getElementById('count-all').textContent = allData.articles.length;
}

function renderPills() {
  const container = document.getElementById('catPills');
  container.innerHTML = '';

  const pills = [
    { id: 'all', name: '全部', icon: allIcon }
  ].concat(allData.categories.sort((a,b) => a.order - b.order).map(c => ({ id: c.id, name: c.name, icon: iconMap[c.id] || folderIcon })));

  pills.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (activeCat === p.id ? ' active' : '');
    btn.dataset.cat = p.id;
    btn.onclick = () => filterCat(p.id);
    btn.innerHTML = `${p.icon} ${p.name}`;
    container.appendChild(btn);
  });
}

function renderStats() {
  document.getElementById('stat-articles').textContent = allData.articles.length;
  document.getElementById('stat-cats').textContent = allData.categories.length;
  const allTags = [...new Set(allData.articles.flatMap(a => a.tags||[]))];
  document.getElementById('stat-tags').textContent = allTags.length;
  const totalViews = allData.articles.reduce((s,a) => s + (a.views||0), 0);
  document.getElementById('stat-views').textContent = totalViews >= 1000 ? (totalViews/1000).toFixed(1)+'k' : totalViews;
}

function getCat(catId) {
  const cat = allData.categories.find(c => c.id === catId);
  return cat || { name: catId, icon: folderIcon };
}

function renderArticles() {
  const grid = document.getElementById('articlesGrid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  let arts = allData.articles;
  if (activeCat !== 'all') arts = arts.filter(a => a.category === activeCat);
  if (q) arts = arts.filter(a => a.title.toLowerCase().includes(q) || (a.tags||[]).some(t => t.toLowerCase().includes(q)) || (a.desc||'').toLowerCase().includes(q));

  if (arts.length === 0) {
    grid.innerHTML = `<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>没有找到相关文章</p></div>`;
    return;
  }

  grid.innerHTML = arts.map(a => {
    const cat = getCat(a.category);
    return `<div class="article-card fade-in" onclick="openDetail('${a.id}')">
      <div class="card-top">
        <div class="card-cat-badge">${cat.icon} ${cat.name}</div>
        <div class="card-level">${a.level||''}</div>
      </div>
      <div class="card-title">${a.title}</div>
      <div class="card-desc">${a.desc||''}</div>
      <div class="card-tags">${(a.tags||[]).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="card-footer">
        <div class="footer-item">${userIcon} ${a.author||'imoons'}</div>
        <div class="footer-sep"></div>
        <div class="footer-item">${calIcon} ${a.date||''}</div>
        <div class="footer-sep"></div>
        <div class="footer-item">${eyeIcon} ${a.views||0}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Filter ──
function filterCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-pill, .sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === cat);
  });
  renderArticles();
}

// ── Search ──
document.getElementById('searchInput').addEventListener('input', function() {
  document.getElementById('searchClear').classList.toggle('visible', this.value.length > 0);
  renderArticles();
});

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('visible');
  renderArticles();
}

// ── Detail ──
function openDetail(id) {
  const a = allData.articles.find(x => x.id === id);
  if (!a) return;
  const cat = getCat(a.category);

  document.getElementById('detailTitle').textContent = a.title;
  document.getElementById('detailInfo').innerHTML = `
    <div class="detail-info-item">${cat.icon} ${cat.name}</div>
    <div class="detail-info-item">${levelIcon} ${a.level||''}</div>
    <div class="detail-info-item">${calIcon} ${a.date||''}</div>
    <div class="detail-info-item">${eyeIcon} ${a.views||0} 次阅读</div>
    <div class="detail-info-item">${userIcon} ${a.author||'imoons'}</div>
    <div class="card-tags" style="margin-top:8px">${(a.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
  `;
  document.getElementById('detailBody').innerHTML = a.content || '<p>内容加载中...</p>';
  document.getElementById('detailOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeDetail(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('detailOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

// ── Theme ──
(function() {
  const saved = localStorage.getItem('kb-theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('kb-theme', isDark ? '' : 'dark');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (e.key === '/' && !e.target.matches('input')) { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

// ── SVG Icon Library ──
const allIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`;
const folderIcon = `<svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
const gridIcon = `<svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`;
const serverIcon = `<svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`;
const cloudIcon = `<svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`;
const aiIcon = `<svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 2a10 10 0 0 1 10 10"/><circle cx="12" cy="12" r="3"/><path d="M12 9v-2M12 17v-2M9 12H7M17 12h-2"/></svg>`;
const toolIcon = `<svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`;
const userIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
const calIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
const eyeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const levelIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;

// ── Init ──
loadData();
</script>
</body>
</html>
